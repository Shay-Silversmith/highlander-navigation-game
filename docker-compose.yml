services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      GRAPH_CACHE_DIR: /data/graph-cache
      OFFLINE: "${OFFLINE:-true}"
    volumes:
      - graph-cache:/data/graph-cache
    restart: unless-stopped

volumes:
  graph-cache:
